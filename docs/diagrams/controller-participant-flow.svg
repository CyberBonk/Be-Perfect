<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Controller and participant event flow</title>
  <desc id="desc">A controller configures one event room. Firebase distributes the confirmed schedule to multiple participant devices, which continue the local countdown and alarms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1720"/>
      <stop offset="1" stop-color="#132b3a"/>
    </linearGradient>
    <linearGradient id="controller" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#2a9ed0"/>
    </linearGradient>
    <linearGradient id="participant" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9d45b"/>
      <stop offset="1" stop-color="#e99c26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#8ed8ff"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#f5f8fa" font-family="Arial, sans-serif" font-size="30" font-weight="700">One room, one confirmed schedule, many synchronized devices</text>
  <text x="600" y="90" text-anchor="middle" fill="#a9c0cc" font-family="Arial, sans-serif" font-size="17">The controller sends commands online; participants keep the last confirmed timer locally during brief outages.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="250" height="270" rx="28" fill="#172631" stroke="#4e7080" stroke-width="2"/>
    <rect x="95" y="225" width="200" height="145" rx="18" fill="url(#controller)"/>
    <circle cx="195" cy="407" r="13" fill="#8ed8ff"/>
    <text x="195" y="425" text-anchor="middle" fill="#f5f8fa" font-family="Arial, sans-serif" font-size="25" font-weight="700">Controller</text>
    <text x="195" y="450" text-anchor="middle" fill="#a9c0cc" font-family="Arial, sans-serif" font-size="16">Creates room · controls run</text>
    <text x="195" y="282" text-anchor="middle" fill="#07344c" font-family="Arial, sans-serif" font-size="25" font-weight="700">QR + PIN</text>
    <text x="195" y="318" text-anchor="middle" fill="#07344c" font-family="Arial, sans-serif" font-size="17">Rounds · alarms · presence</text>
  </g>

  <g>
    <path d="M330 325H470" stroke="#8ed8ff" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="375" y="276" width="135" height="48" rx="24" fill="#1f4355" stroke="#4e7080"/>
    <text x="442" y="307" text-anchor="middle" fill="#d9f1ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Firebase</text>
    <text x="442" y="351" text-anchor="middle" fill="#a9c0cc" font-family="Arial, sans-serif" font-size="14">room state + heartbeat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="135" width="180" height="185" rx="24" fill="#172631" stroke="#4e7080" stroke-width="2"/>
    <rect x="720" y="160" width="140" height="98" rx="14" fill="url(#participant)"/>
    <text x="790" y="289" text-anchor="middle" fill="#f5f8fa" font-family="Arial, sans-serif" font-size="22" font-weight="700">Participant</text>
    <text x="790" y="312" text-anchor="middle" fill="#a9c0cc" font-family="Arial, sans-serif" font-size="14">follows timer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="245" width="180" height="185" rx="24" fill="#172631" stroke="#4e7080" stroke-width="2"/>
    <rect x="950" y="270" width="140" height="98" rx="14" fill="url(#participant)"/>
    <text x="1020" y="399" text-anchor="middle" fill="#f5f8fa" font-family="Arial, sans-serif" font-size="22" font-weight="700">Participant</text>
    <text x="1020" y="422" text-anchor="middle" fill="#a9c0cc" font-family="Arial, sans-serif" font-size="14">receives alarms</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="380" width="180" height="185" rx="24" fill="#172631" stroke="#4e7080" stroke-width="2"/>
    <rect x="640" y="405" width="140" height="98" rx="14" fill="url(#participant)"/>
    <text x="710" y="534" text-anchor="middle" fill="#f5f8fa" font-family="Arial, sans-serif" font-size="22" font-weight="700">Participant</text>
    <text x="710" y="557" text-anchor="middle" fill="#a9c0cc" font-family="Arial, sans-serif" font-size="14">shows offline state</text>
  </g>

  <path d="M520 300C610 260 640 220 700 220" fill="none" stroke="#8ed8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M520 335C690 350 780 335 930 335" fill="none" stroke="#8ed8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M520 370C580 430 600 470 620 470" fill="none" stroke="#8ed8ff" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
